name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cofactor regression tests (extractor, CLI, check/report library)
        run: bash tests/run_tests.sh
