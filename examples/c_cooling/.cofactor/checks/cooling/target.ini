# c_cooling: the smallest complete cofactor target. Plain C code, no build or dump step: the functions are copied from
# cooling.c (the project root) and called on synthetic inputs. 'planted_bug' compiles a deliberately wrong derivative and must FAIL.
[target]
description = tabulated cooling function: hand dLambda/dT and Newton dR/dT vs Enzyme (self-contained smoke test)
spec = spec.py
harness = harness.cc
bars = bars.txt
harness_args = {cfg}
harness_timeout = 300

[config:clean]
defines =

[config:planted_bug]
defines = PLANTED_BUG
expect = FAIL
