# GIZMO softened gravity: the four closed forms of kernel_gravity (phi, force, tidal, dphi/dh) against each other and
# against the SPH kernel of the same shape (Poisson), plus continuity at the internal joints and at u = 1 (Newtonian).
[target]
description = GIZMO kernel_gravity: force/tidal/dphi_dh vs Enzyme derivatives of phi, Poisson vs kernel_main, continuity
harness_args = {cfg}
harness_timeout = 600

[config:k1]
defines = KERNEL_FUNCTION=1 NUMDIMS=3

[config:k2]
defines = KERNEL_FUNCTION=2 NUMDIMS=3

[config:k3]
defines = KERNEL_FUNCTION=3 NUMDIMS=3

[config:k4]
defines = KERNEL_FUNCTION=4 NUMDIMS=3

[config:k5]
defines = KERNEL_FUNCTION=5 NUMDIMS=3

[config:k6]
defines = KERNEL_FUNCTION=6 NUMDIMS=3

[config:k7]
defines = KERNEL_FUNCTION=7 NUMDIMS=3

[config:k8]
defines = KERNEL_FUNCTION=8 NUMDIMS=3

[config:k9]
defines = KERNEL_FUNCTION=9 NUMDIMS=3
