# example_kernel: GIZMO's kernel function and its hand-coded derivative, every kernel shape x dimension.
# No GIZMO build, no dump run: the code is copied from the source tree and called on synthetic inputs.
[target]
description = GIZMO kernel_main (mesh/kernel.h): hand dwk vs Enzyme d(wk)/du, all KERNEL_FUNCTION x NUMDIMS; smoke test
spec = spec.py
harness = harness.cc
bars = bars.txt
needs_gizmo_build = no
needs_dump = no
harness_args = {cfg}
harness_timeout = 600

[config:k1_1d]
defines = KERNEL_FUNCTION=1 NUMDIMS=1

[config:k1_2d]
defines = KERNEL_FUNCTION=1 NUMDIMS=2

[config:k1_3d]
defines = KERNEL_FUNCTION=1 NUMDIMS=3

