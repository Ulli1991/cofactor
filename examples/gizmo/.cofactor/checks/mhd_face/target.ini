# mhd_face: the GIZMO MHD face (MFM/MFV; Dedner GLM or psi/c_h cleaning), Powell terms and the final per-cell bookings.
# Build with the face-dump hook, one-rank dump run, replay of every dumped face, Enzyme Jacobians/adjoints/energy bookings.
[target]
description = GIZMO MHD face: harness = GIZMO, psi/c_h adjoint, face-state Jacobian, energy bookings, Powell, Galilean rows
extract_from = build
build = {gizmo_build}
build_timeout = 2400
dump =
    cp {target}/run.params run.params
    env -u LD_LIBRARY_PATH python3 {target}/make_ic.py box_ic.hdf5 {src}/test/mhd_kernel_volume_energy
    {mpirun} {build}/GIZMO run.params
dump_output = output/face_dump.bin
dump_timeout = 1500
harness_flags = {gizmo_harness_flags}
harness_args = {dumprun}/output/face_dump.bin {cfg}
harness_timeout = 3000

[vars]
config_base = MAGNETIC BOX_PERIODIC EOS_GAMMA=(5.0/3.0) SELFGRAVITY_OFF OUTPUT_IN_DOUBLEPRECISION OUTPUT_BFIELD_DIVCLEAN_INFO TEST_MHD_ENERGY_LEDGER_OUTPUT TEST_MHD_DUMP_FACE_STATES

[config:mfm_psi_nf]
config_flags = HYDRO_MESHLESS_FINITE_MASS DIVBCLEANING_CONSERVATIVE_PSI_OVER_CH

[config:mfv_psi_nf]
config_flags = HYDRO_MESHLESS_FINITE_VOLUME WAKEUP_TRUNCATE_STEP_ON_DEMOTION DIVBCLEANING_CONSERVATIVE_PSI_OVER_CH

[config:mfm_ded_nf]
config_flags = HYDRO_MESHLESS_FINITE_MASS

[config:mfv_ded_nf]
config_flags = HYDRO_MESHLESS_FINITE_VOLUME WAKEUP_TRUNCATE_STEP_ON_DEMOTION

[config:mfm_psi_kvp_nf]
config_flags = HYDRO_MESHLESS_FINITE_MASS DIVBCLEANING_CONSERVATIVE_PSI_OVER_CH MHD_MAGNETIC_PRESSURE_FROM_KERNEL_VOLUME

[config:mfm_ded_kvp_nf]
config_flags = HYDRO_MESHLESS_FINITE_MASS MHD_MAGNETIC_PRESSURE_FROM_KERNEL_VOLUME
