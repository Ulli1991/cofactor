# cofactor setup for GIZMO (copy this .cofactor/ directory into a GIZMO source tree, or run with -s <gizmo tree>).
[project]
name = gizmo

[vars]
# no FMA contraction: the harness, compiled separately, must reproduce GIZMO's arithmetic exactly
gizmo_optimize = -g -O3 -march=native -ffp-contract=off -Wall -Wextra -Wno-unused-parameter -Wno-unknown-pragmas
# what a harness that compiles against a GIZMO build needs besides the build's own headers
gizmo_harness_flags = -I{build}/hydro -I{build} -I{cofactor}/adapters/gizmo {build}/declarations/allvars.cc {mpi_cflags} -I${GSL_HOME}/include -I${HDF5_HOME}/include -DH5_USE_16_API -DHDF5_DISABLE_VERSION_CHECK -L${GSL_HOME}/lib -lgsl -lgslcblas -lm
# the build recipe of a check with a hook: Config.sh = {config_base} + the config's {config_flags}
gizmo_build = bash {cofactor}/adapters/gizmo/build.sh {src} {build} {target}/hook.patch {make_jobs} "{gizmo_optimize}" -- {config_base:q} {config_flags:q}
