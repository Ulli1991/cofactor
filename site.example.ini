# cofactor site configuration (this machine): copy to ~/.config/cofactor/site.ini (or <cofactor>/site.ini, or point
# COFACTOR_SITE to it) and edit. Lines are passed to bash, so $VARS from the module system (e.g. $GSL_HOME) may be used.

[toolchain]
# shell lines run before every step (module system, environment)
prelude =
    source /etc/profile.d/modules.sh
    module purge
    module load gcc openmpi gsl hwloc fftw-mpi hdf5-mpi
    export LD_LIBRARY_PATH=$HDF5_HOME/lib:$GSL_HOME/lib:$FFTW_HOME/lib:${LD_LIBRARY_PATH:-}
# extra lines before compiling and running a harness (clang + Enzyme)
harness_prelude =
    module load clang/18
clang = clang++
enzyme_plugin = /path/to/Enzyme/build/Enzyme/ClangEnzyme-18.so

[vars]
# machine-specific placeholders for the recipes of every project ({name}); these override project and check values
make_jobs = 8
mpirun = mpirun --bind-to none -x LD_LIBRARY_PATH -np 1
mpi_cflags = $(mpicxx -show | cut -d' ' -f2-)

[batch]
# yes: build/dump/harness/run refuse to start outside a batch job (e.g. on login nodes); 'submit' writes and submits one
require_batch = yes
# environment variable that is set inside a batch job
job_env = SLURM_JOB_ID
submit = sbatch
# header lines of the generated job script
header =
    #SBATCH -p p.shared
    #SBATCH -N 1
    #SBATCH --ntasks=1
    #SBATCH --cpus-per-task=8
    #SBATCH --mem=24G
    #SBATCH -t 04:00:00

[paths]
# builds, dumps, extractions and results (one directory per check and config)
work = /path/to/scratch/cofactor_work
