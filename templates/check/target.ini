# One cofactor check. Steps: [build] -> [dump] -> extract (spec.py) -> compile harness.cc with Enzyme -> run -> report vs bars.txt
[target]
description = TODO: what this check verifies
spec = spec.py
harness = harness.cc
bars = bars.txt
# where spec.py copies from: src (the source tree, default) or build (the build copy made by the build recipe)
extract_from = src
# optional shell recipes, run in {build} / {dumprun}; placeholders: {src} {build} {dumprun} {target} {project} {cfg}
# {cofactor} {lib} {work} {gen} {plugin} {clang}, every [vars] key, every key of the config; {name:q} = words shell-quoted
build =
dump =
# extra compiler/linker flags for the harness (e.g. -I{build}/include {build}/lib/foo.c)
harness_flags =
harness_args = {cfg}

[config:default]
# defines = NAME=VALUE ...   (compile-time defines for the harness and the copied code)
# expect = PASS              (or FAIL for a config that must be caught)
defines =
