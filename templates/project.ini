# cofactor setup of this project. Commit .cofactor/ with the code, like .clang-format.
[project]
name = my_project

[defaults]
# keys every check inherits unless it sets them (spec, harness, bars, build, dump, harness_flags, std, extract_from, ...)
std = c++14

[vars]
# project-wide placeholders, usable as {name} in every recipe; the site's [vars] override them on a given machine
